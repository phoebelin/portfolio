<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phoebe Lin — Product Designer</title>
<meta name="description" content="Product designer working on agentic workflows at Roblox. Previously K-12 education at the Chan Zuckerberg Initiative.">
<meta property="og:title" content="Phoebe Lin — Product Designer">
<meta property="og:description" content="Product designer working on agentic workflows at Roblox. Previously K-12 education at the Chan Zuckerberg Initiative.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.phoebezlin.com/images/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" media="(prefers-color-scheme: dark)" type="image/png" href="/favicon-32-dark.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..400&amp;family=Karla:wght@300..700&amp;family=JetBrains+Mono:wght@300..500&amp;display=swap" rel="stylesheet">
<script src="/content.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #fbfbf9; }
  a, a:hover { color: inherit; text-decoration: none; }
  ::selection { background: #e2e1da; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
  @keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }
  @media (max-width: 900px) {
    [data-pad] { padding-left: 20px !important; padding-right: 20px !important; }
    [data-intro] { font-size: 19px !important; }
    [data-shots] { grid-template-columns: 1fr !important; }
    [data-ptitle] { font-size: 24px !important; }
  }
</style>
</helmet>

<div style="font-family: 'Karla', sans-serif; color: {{ fg }}; background: {{ bg }}; min-height: 100vh; transition: background 420ms ease, color 420ms ease;">

  <div data-pad="1" style="position: sticky; top: 0; z-index: 10; padding: 26px 56px; display: flex; align-items: baseline; justify-content: space-between; background: {{ bg }}; transform: {{ nav }}; transition: transform 420ms cubic-bezier(0.4,0,0.2,1), background 420ms ease;">
    <a href="/" style="font-family: 'Newsreader', serif; font-size: 26px; letter-spacing: -0.01em;">{{ name }}</a>
    <span style="display: flex; align-items: center; gap: 28px; font-size: 14px;">
      <a href="#work" style="background-image: linear-gradient(currentColor, currentColor); background-size: 100% 1px; background-position: 0 100%; background-repeat: no-repeat; padding-bottom: 3px;">Work</a>
      <a href="/writing" style="opacity: 0.5; background-image: linear-gradient(currentColor, currentColor); background-size: 0% 1px; background-position: 0 100%; background-repeat: no-repeat; padding-bottom: 3px; transition: background-size 320ms cubic-bezier(0.4,0,0.2,1), opacity 220ms;" style-hover="opacity: 1; background-size: 100% 1px;">Writing</a>
      <a href="/about" style="opacity: 0.5; background-image: linear-gradient(currentColor, currentColor); background-size: 0% 1px; background-position: 0 100%; background-repeat: no-repeat; padding-bottom: 3px; transition: background-size 320ms cubic-bezier(0.4,0,0.2,1), opacity 220ms;" style-hover="opacity: 1; background-size: 100% 1px;">About</a>
      <button onClick="{{ toggle }}" aria-label="Toggle theme" title="Toggle theme" style="border: 0; background: none; color: inherit; cursor: pointer; font-size: 15px; padding: 4px; line-height: 1; opacity: 0.55; transition: transform 500ms cubic-bezier(0.4,0,0.2,1), opacity 200ms;" style-hover="opacity: 1; transform: rotate(-24deg);">{{ icon }}</button>
    </span>
  </div>

  <div data-pad="1" style="padding: 60px 56px 96px; display: flex; flex-direction: column; gap: 84px;">
    <p data-intro="1" style="margin: 0; max-width: clamp(560px, 50vw, 760px); font-family: 'Newsreader', serif; font-size: 23px; line-height: 1.5; font-weight: 300; text-wrap: pretty; animation: riseIn 700ms cubic-bezier(0.2,0.8,0.2,1) both;">{{ intro }}</p>

    <div id="work" style="display: flex; flex-direction: column; gap: 56px; animation: riseIn 700ms 120ms cubic-bezier(0.2,0.8,0.2,1) both;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.45;">Select work</div>
      <sc-for list="{{ projects }}" as="p" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 18px;">
          <div style="display: flex; align-items: baseline; gap: 16px;">
            <a href="{{ p.href }}" data-ptitle="1" style="font-family: 'Newsreader', serif; font-size: 27px; letter-spacing: -0.01em; background-image: linear-gradient(currentColor, currentColor); background-size: 0% 1px; background-position: 0 100%; background-repeat: no-repeat; padding-bottom: 2px; transition: background-size 340ms cubic-bezier(0.4,0,0.2,1);" style-hover="background-size: 100% 1px;">{{ p.title }}</a>
            <span style="font-size: 13px; opacity: 0.45;">{{ p.date }}</span>
          </div>
          <p style="margin: 0; max-width: clamp(560px, 50vw, 760px); font-size: 15px; line-height: 1.6; opacity: 0.75; text-wrap: pretty;">{{ p.teaser }} <a href="{{ p.href }}" style="white-space: nowrap; background-image: linear-gradient(currentColor, currentColor); background-size: 100% 1px; background-position: 0 100%; background-repeat: no-repeat; transition: background-size 300ms;" style-hover="background-size: 0% 1px;">Read more</a></p>
          <div data-shots="1" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 6px;">
            <sc-for list="{{ p.assets }}" as="a" hint-placeholder-count="3">
              <button onClick="{{ a.open }}" style="border: 0; padding: 0; display: block; position: relative; overflow: hidden; width: 100%; cursor: zoom-in; aspect-ratio: 4 / 3; border-radius: 3px; background: {{ a.tile }}; transition: transform 420ms cubic-bezier(0.2,0.8,0.2,1), box-shadow 320ms;" style-hover="transform: translateY(-4px); box-shadow: 0 10px 30px rgba(18,18,16,0.14);">
                <sc-if value="{{ a.isVideo }}" hint-placeholder-val="{{ false }}">
                  <video src="{{ a.src }}" autoplay="autoplay" loop="loop" muted="muted" playsinline="playsinline" preload="auto" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;"></video>
                </sc-if>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 28px; border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent); font-size: 14px;">
      <span style="opacity: 0.5;">{{ footerNote }}</span>
    </div>
  </div>

  <sc-if value="{{ lbOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ lbClose }}" style="position: fixed; inset: 0; z-index: 40; background: rgba(18,18,16,0.84); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 48px; cursor: zoom-out; animation: veilIn 240ms ease both;">
      <div style="width: min(1040px, 100%); display: flex; flex-direction: column; gap: 14px; animation: popIn 320ms cubic-bezier(0.2,0.8,0.2,1) both;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; color: #f6f5f1; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em;">
          <span>{{ lbCaption }}</span>
          <span style="opacity: 0.6;">{{ lbCounter }} · arrow keys · esc</span>
        </div>
        <div style="position: relative; aspect-ratio: 16 / 10; background: {{ lbTile }}; border-radius: 4px; overflow: hidden;">
          <sc-if value="{{ lbVideo }}" hint-placeholder-val="{{ false }}">
            <video src="{{ lbSrc }}" autoplay="autoplay" loop="loop" muted="muted" playsinline="playsinline" preload="auto" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block;"></video>
          </sc-if>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const CASE = "/work";

const S = () => (window.SITE || {});


class Component extends DCLogic {
  state = { nav: true, lb: null, dark: (typeof localStorage !== "undefined" && localStorage.getItem("pl-theme") === "dark") };

  componentDidMount() {
    document.body.style.background = this.state.dark ? "#131312" : "#fbfbf9";
    this.onContent = () => this.forceUpdate();
    window.addEventListener("site-content", this.onContent);
    try {
      if (sessionStorage.getItem("pl-back") === "1") {
        const y = parseInt(sessionStorage.getItem("pl-home-scroll") || "0", 10);
        sessionStorage.removeItem("pl-back");
        if (y > 0) this.restoreTo(y);
      }
    } catch (e) {}
    this.last = window.scrollY;
    this.onScroll = () => {
      const y = window.scrollY;
      if (!this.restoring) { try { sessionStorage.setItem("pl-home-scroll", String(y)); } catch (e) {} }
      const down = y > this.last + 4;
      const up = y < this.last - 4;
      if (down || up) this.last = y;
      const show = y < 40 ? true : down ? false : up ? true : this.state.nav;
      if (show !== this.state.nav) this.setState({ nav: show });
    };
    window.addEventListener("scroll", this.onScroll, { passive: true });
    this.onKey = (e) => {
      if (this.state.lb === null) return;
      if (e.key === "Escape") this.setState({ lb: null });
      if (e.key === "ArrowRight") this.step(1);
      if (e.key === "ArrowLeft") this.step(-1);
    };
    window.addEventListener("keydown", this.onKey);
  }

  step(d) {
    const projects = (S().home || {}).projects || [];
    this.setState((s) => {
      if (s.lb === null) return null;
      const p = projects[s.lb.p] || {};
      const n = (p.images && p.images.length) || p.shots || 3;
      return { lb: { p: s.lb.p, i: (s.lb.i + d + n) % n } };
    });
  }

  restoreTo(y) {
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    this.restoring = true;
    const deadline = Date.now() + 3000;
    const tick = () => {
      const fits = document.documentElement.scrollHeight >= y + window.innerHeight;
      if (fits) window.scrollTo(0, y);
      const done = (fits && Math.abs(window.scrollY - y) < 2) || Date.now() > deadline;
      if (done) {
        this.restoring = false;
        this.last = window.scrollY;
        if (this.ro) { this.ro.disconnect(); this.ro = null; }
        return;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    if (typeof ResizeObserver !== "undefined") {
      this.ro = new ResizeObserver(() => { if (this.restoring) tick(); });
      this.ro.observe(document.documentElement);
    }
    window.addEventListener("load", tick, { once: true });
  }

  componentWillUnmount() {
    if (this.ro) { this.ro.disconnect(); this.ro = null; }
    this.restoring = false;
    window.removeEventListener("scroll", this.onScroll);
    window.removeEventListener("site-content", this.onContent);
    window.removeEventListener("keydown", this.onKey);
  }

  toggle = () => {
    const dark = !this.state.dark;
    try { localStorage.setItem("pl-theme", dark ? "dark" : "light"); } catch (e) {}
    document.body.style.background = dark ? "#131312" : "#fbfbf9";
    this.setState({ dark });
  };

  renderVals() {
    const s = this.state;
    const TINT = "color-mix(in srgb, currentColor 9%, transparent)";
    const isVid = (u) => /\.(mp4|webm|mov|m4v)$/i.test(u || "");
    const projects = (S().home || {}).projects || [];
    const v = {
      bg: s.dark ? "#131312" : "#fbfbf9",
      fg: s.dark ? "#eceae4" : "#171714",
      icon: s.dark ? "☀" : "☾",
      toggle: this.toggle,
      nav: s.nav ? "translateY(0)" : "translateY(-102%)",
      name: S().name,
      email: S().email,
      mailto: "mailto:" + (S().email || ""),
      footerNote: S().footerNote,
      intro: (S().home || {}).intro,
      projects: projects.map((p, pi) => Object.assign({}, p, {
        href: p.slug ? CASE + "/" + p.slug : CASE,
        assets: Array.from({ length: (p.images && p.images.length) || p.shots || 3 }).map((_, ai) => {
          const src = (p.images && p.images[ai]) || "";
          const video = isVid(src);
          return {
            src: src,
            isVideo: video,
            tile: (src && !video) ? ("url(" + src + ") center/cover no-repeat, " + TINT) : TINT,
            open: () => this.setState({ lb: { p: pi, i: ai } })
          };
        })
      })),
      lbOpen: s.lb !== null
    };
    if (s.lb !== null) {
      const p = projects[s.lb.p] || {};
      const src = (p.images && p.images[s.lb.i]) || "";
      const video = isVid(src);
      v.lbCaption = p.title || "";
      v.lbCounter = (s.lb.i + 1) + " / " + ((p.images && p.images.length) || p.shots || 3);
      v.lbSrc = src;
      v.lbVideo = video;
      v.lbTile = (src && !video) ? ("url(" + src + ") center/contain no-repeat, #2a2a27") : "#2a2a27";
      v.lbClose = () => this.setState({ lb: null });
    }
    return v;
  }
}
</script>
</body>
</html>
